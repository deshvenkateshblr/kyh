<script>
const state   = loadState() || {};
const profile = state.profile || {};
const routine = state.routine || {};
const userSymptoms = profile.symptoms || [];

renderHeader('diet', 'KYH-Diet');
renderFooter()

// Restore any previous diet answers for this session
let dietState = Object.assign({
  type: profile.dietType || "",
  cuisine: profile.cuisine || "",
  frequency: {},
  intake: {},  // { [nutrient]: { meeting: "yes"|"partial"|"no" } }
  priorities: [],
  target: null
}, state.diet || {});
// Dietary & cuisine preference now live on the Profile step — always trust
// the profile value over anything stale saved earlier in diet state.
if (profile.dietType) dietState.type = profile.dietType;
if (profile.cuisine)  dietState.cuisine = profile.cuisine;

let hideTargetsHook = null;   // set by renderPage: clears the targets when an answer changes
function saveDietProgress() {
  const next = Object.assign({}, state, { diet: dietState });
  persistState(next);
  if (hideTargetsHook) hideTargetsHook();
}

function getExamples(nutrientName) {
  const diet = dietState.type || "Vegetarian";
  const cuisine = dietState.cuisine || "Indian";

  const base = (window.PREF_FOOD_EXAMPLES?.[diet] || {})[nutrientName] || "";
  const extra = (window.CUISINE_EXTRAS?.[cuisine]?.[diet] || {})[nutrientName] || "";

  if (extra) return extra;  // diet-specific regional wins
  return base;
}

function scoreNutrient(n) {
  let score = 0;
  const matched = (n.symptoms || []).filter(s => userSymptoms.includes(s));
  score += matched.length * 12;

  const userProfiles = deriveRiskCategories(profile).cats;
  score += (n.profile || "").split(";").filter(p => userProfiles.includes(p.trim())).length * 8;

  Object.entries(dietState.frequency || {}).forEach(([id, freq]) => {
    const marker = (window.FOOD_QUALITY || []).find(f => f.id === id);
    if (!marker) return;
    if (marker.type === "protective" && (freq === "Rarely" || freq === "1-2x/Wk" || freq === "Sometimes")) {
      if (marker.nutrientsBoosted.includes(n.nutrient)) score += 5;
    }
    if (marker.type === "harmful" && (freq === "Daily" || freq === "3-5x/Wk" || freq === "Most days")) {
      if (n.nutrient === "Added Sugars / Refined Carbohydrates") score += 11;
    }
  });

  if (isCurrentUse(profile.alcohol) &&
      ["Magnesium","Vitamin B12","Zinc","Protein"].includes(n.nutrient)) score += 4;
  if (isCurrentUse(profile.smoking) &&
      ["Zinc","Omega-3 (EPA/DHA)"].includes(n.nutrient)) score += 3;
  const bmiKind = bmiClass(profile.bmi, profile);
  if ((bmiKind === 'over' || bmiKind === 'obese') &&
      ["Protein","Fibre","Magnesium","Chromium","Omega-3 (EPA/DHA)","Added Sugars / Refined Carbohydrates"].includes(n.nutrient)) score += 6;

  return { score, matched };
}

/* ---------- Render page ---------- */
function renderPage() {
  if (!profile.sex) {
    document.getElementById("main-content").innerHTML =
      `<div class="empty-state">We need your profile first. <a href="profile.html">Go back to start →</a></div>`;
    return;
  }
  const main = document.getElementById("main-content");
  const DIET_TYPES = ["Vegetarian","Vegan","Eggetarian","Jain","Pescatarian","Non-Vegetarian"];
  const CUISINES = ["Indian","Mediterranean","East Asian","Middle Eastern","Western / Continental"];
  const curDiet = profile.dietType || dietState.type || "";
  const curCuisine = profile.cuisine || dietState.cuisine || "Indian";
  const opts = (list, cur) => list.map(v => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(v)}</option>`).join("");
  main.innerHTML = `
    <p class="lede" style="margin-bottom:28px;">
      Based on your symptoms, body composition, routine and preferences we prioritise the nutrients that matter most for you right now.
    </p>

    ${bodySizeNoticeHtml(profile, 'diet.html')}
    <div class="note-block" style="margin-bottom:28px;">
      <span class="k">Dietary &amp; cuisine preference</span>
      ${curDiet ? `<p id="pref-summary" style="margin:8px 0 0;font-size:14.5px;">${esc(curDiet)} &middot; ${esc(curCuisine)} cuisine
        <button type="button" id="pref-change" class="refine-back" style="margin-left:10px;">Change</button></p>` : ""}
      <div class="field-row" id="pref-fields" style="margin-top:10px;max-width:520px;${curDiet ? "display:none;" : ""}">
        <div class="field">
          <label class="intake-label" for="d-type">Dietary preference</label>
          <select id="d-type"><option value=""${curDiet ? "" : " selected"} disabled>&mdash; Select &mdash;</option>${opts(DIET_TYPES, curDiet)}</select>
        </div>
        <div class="field">
          <label class="intake-label" for="d-cuisine">Cuisine</label>
          <select id="d-cuisine">${opts(CUISINES, curCuisine)}</select>
        </div>
      </div>
    </div>

    <div class="cat-title">Your usual foods</div>
    <div id="markers-container" style="margin-bottom:36px;"></div>

    <div class="cat-title">Nutrient Priorities</div>
    <p class="lede" style="font-size:14px; margin-bottom:16px;" id="priority-meta">Ranked for you</p>
    <div id="nutrient-list"></div>
    <div id="nutrient-more"></div>

    <div class="page-footer-nav" id="diet-nav">
      <a href="routine.html#plan" class="btn secondary">← Back</a>
      <span id="answer-counter" style="font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 14px;"></span>
      <a href="#" id="skip-btn" class="btn secondary">Skip diet, see my findings →</a>
      <button type="button" class="btn" id="continue-btn">Show my diet targets ↓</button>
    </div>
    <div id="diet-targets" style="display:none;margin-top:48px;"></div>
  `;

  // Food Quality Matrix
  renderFrequencyMatrix();
  // Nutrient cards
  renderNutrients();

  // Dietary / cuisine preference picked here (Profile no longer requires it)
  function onPrefChange() {
    const t = document.getElementById("d-type").value;
    const c = document.getElementById("d-cuisine").value;
    if (t) { profile.dietType = t; dietState.type = t; }
    profile.cuisine = c; dietState.cuisine = c;
    persistState(Object.assign({}, state, { profile, diet: dietState }));
    if (hideTargetsHook) hideTargetsHook();
    renderNutrients();
  }
  const prefChange = document.getElementById("pref-change");
  if (prefChange) prefChange.addEventListener("click", () => {
    document.getElementById("pref-fields").style.display = "";
    document.getElementById("pref-summary").style.display = "none";
  });
  document.getElementById("d-type").addEventListener("change", onPrefChange);
  document.getElementById("d-cuisine").addEventListener("change", onPrefChange);

  // Frequency matrix change
 document.getElementById("markers-container").addEventListener("click", onFoodChip);

  // Every answer here is optional: a live counter, no gate.
  // Targets are worked out on click and shown below; if an answer changes afterwards they are cleared
  // so what is on screen always matches what is saved.
  const targetsBox = document.getElementById('diet-targets');
  const continueBtn = document.getElementById('continue-btn');
  let targetsShown = false;

  function countNutrientAnswered() {
    return [...document.querySelectorAll('#nutrient-list .test-card')]
      .filter(card => card.querySelector('input[type=radio]:checked')).length;
  }
  function updateCounter() {
    const n = countNutrientAnswered();
    const total = document.querySelectorAll('#nutrient-list .test-card').length;
    const el = document.getElementById('answer-counter');
    if (!el || !total) return;
    el.textContent = n === total ? '' : `${n} of ${total} answered (optional)`;
    el.style.color = 'var(--muted)';
  }
  updateCounter();

  function computeTargets() {
    const rb = resolveDailyBurn(routine, profile);
    const estBurn = rb.burn;
    const { cal: targetCal, factor, floored, lowBurn, floorKcal } = estimateTargetCalories(estBurn, profile);
    const waterL = estimateWaterLiters(profile, estBurn);
    dietState.target = {
      cal: targetCal,
      waterL: waterL,
      factor: factor,
      note: `Burn ~${estBurn.toLocaleString()} kcal${rb.assumed ? ' (assumed, routine not confirmed)' : ''} \u00d7 ${factor} (body-composition adjusted)${bodySizeAssumed(profile) ? ' \u00b7 typical body size assumed (70 kg, 168 cm)' : ''}`,
      burnAssumed: rb.assumed,
      floored: floored, lowBurn: lowBurn, floorKcal: floorKcal
    };
    dietState.priorities = (window.NUTRIENTS || [])
      .map(n => ({ ...n, ...scoreNutrient(n) }))
      .sort((a, b) => b.score - a.score)
      .slice(0, 10);
  }

  function showTargets() {
    computeTargets();
    const next = Object.assign({}, state, { diet: dietState });
    persistState(next);
    targetsShown = true;
    targetsBox.style.display = '';
    continueBtn.style.display = 'none';
    document.getElementById('skip-btn').style.display = 'none';
    window.mountDietTargets(targetsBox, next, () => goTo('summary.html', next));
    targetsBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function hideTargets() {
    if (!targetsShown) return;
    targetsShown = false;
    targetsBox.style.display = 'none';
    targetsBox.innerHTML = '';
    continueBtn.style.display = '';
    document.getElementById('skip-btn').style.display = '';
  }
  hideTargetsHook = hideTargets;

  continueBtn.addEventListener('click', () => {
    if (!dietState.type) {
      const el = document.getElementById('answer-counter');
      el.textContent = 'Please choose your dietary preference first.';
      el.style.color = 'var(--rose)';
      const t = document.getElementById('d-type');
      t.scrollIntoView({ behavior: 'smooth', block: 'center' });
      t.focus();
      return;
    }
    showTargets();
  });
  document.getElementById('skip-btn').addEventListener('click', e => {
    e.preventDefault();
    goTo('summary.html', state);
  });
}

/* Food pattern: two questions, one tap per food that applies.
   "Most days" = you have it most days. Once someone taps anything in a group, the foods they did not tap
   count as "Sometimes" (not most days); "None of these" records "Rarely" for the whole group.
   Skipping the section records nothing. Older saved answers (Daily, 3-5x/Wk, 1-2x/Wk, Rarely) still read correctly. */
const FQ_MOST = v => v === "Most days" || v === "Daily" || v === "3-5x/Wk";
function renderFrequencyMatrix() {
  const foods = window.FOOD_QUALITY || [];
  const groups = [
    { type: "protective", title: "Foods that help", q: "Which of these do you have most days?" },
    { type: "harmful",    title: "Foods to go easy on", q: "And which of these do you have most days?" }
  ];
  document.getElementById("markers-container").innerHTML = groups.map(g => {
    const list = foods.filter(f => f.type === g.type);
    const none = list.length && list.every(f => dietState.frequency[f.id] === "Rarely");
    return `<div class="fq-group" data-group="${g.type}">
      <div class="fq-title">${g.title}</div>
      <p class="fq-q">${g.q}</p>
      <div class="browse-grid">
        ${list.map(f => `<button type="button" class="browse-chip${FQ_MOST(dietState.frequency[f.id]) ? " selected" : ""}" data-food="${f.id}" aria-pressed="${FQ_MOST(dietState.frequency[f.id])}">${esc(f.label)}</button>`).join("")}
        <button type="button" class="browse-chip${none ? " selected" : ""}" data-none="${g.type}" aria-pressed="${none}">None of these</button>
      </div></div>`;
  }).join("") + `<p class="rt-hint" style="margin-top:4px;">Tap what applies, or skip if you are not sure.</p>`;
}

function onFoodChip(e) {
  const chip = e.target.closest(".browse-chip");
  if (!chip) return;
  const foods = window.FOOD_QUALITY || [];
  const type = chip.dataset.none || (foods.find(f => f.id === chip.dataset.food) || {}).type;
  const list = foods.filter(f => f.type === type);
  const freq = dietState.frequency || (dietState.frequency = {});
  if (chip.dataset.none) {
    const allNone = list.every(f => freq[f.id] === "Rarely");
    list.forEach(f => { if (allNone) delete freq[f.id]; else freq[f.id] = "Rarely"; });
  } else {
    const id = chip.dataset.food;
    freq[id] = FQ_MOST(freq[id]) ? "Sometimes" : "Most days";
    list.forEach(f => { if (!freq[f.id] || freq[f.id] === "Rarely") freq[f.id] = "Sometimes"; });
  }
  saveDietProgress();
  renderFrequencyMatrix();
  renderNutrients();
}

let nutShowAll = false;
function renderNutrients() {
  const list = document.getElementById("nutrient-list");
  if (!list) return;

  const estBurn = resolveDailyBurn(routine, profile).burn;

  const ranked = (window.NUTRIENTS || [])
    .map(n => ({ ...n, ...scoreNutrient(n) }))
    .sort((a, b) => b.score - a.score)
    .slice(0, 10);

  const NUT_FIRST = 5;
  const shownRanked = nutShowAll ? ranked : ranked.slice(0, NUT_FIRST);
  const meta = document.getElementById("priority-meta");
  if (meta) {
    meta.textContent = ranked.length > NUT_FIRST && !nutShowAll ? `Your top ${NUT_FIRST}, most important first.` : "Most important first.";
  }

  list.innerHTML = shownRanked.map((n, idx) => {
    const isLimit = n.direction === "limit";
    const examples = getExamples(n.nutrient);
    const tagClass = isLimit ? "due" : (n.matched.length ? "ok" : "");
    const tagText  = isLimit ? "LIMIT"
      : (n.matched.length ? "FOR: " + n.matched.slice(0, 2).join(", ").toUpperCase() : "BASELINE");

    const current = dietState.intake?.[n.nutrient] || {};
    // migrate old tracking → meeting if needed
    const meeting = current.meeting
      || (current.tracking === "yes" ? "yes" : current.tracking === "no" ? "no" : "");

    const targetLabel = isLimit
      ? null
      : nutrientTargetLabel(n.nutrient, profile, estBurn);

    const promptLabel = isLimit
      ? "KEEPING THIS LIMITED?"
      : (targetLabel ? "ARE YOU MEETING THIS?" : "CURRENT INTAKE?");

    const targetHtml = targetLabel
      ? `<div style="margin-top:8px;font-size:13px;">
           <b>Target:</b> ${targetLabel}
           <span style="font-size:11px;color:var(--ink-soft);"> (guide)</span>
         </div>`
      : "";

    return `
      <div class="test-card" data-nutrient="${n.nutrient}">
        <div class="head">
          <div>
            <div class="name">${idx + 1}. ${n.nutrient}</div>
            <div class="test-desc">${n.note}</div>
            ${examples ? `
              <div style="margin-top:8px;padding:8px 10px;background:var(--paper);border-radius:4px;font-size:12.5px;">
                <b style="color:var(--teal);">Examples:</b> ${examples}
              </div>` : ""}
            ${targetHtml}
          </div>
          <span class="tag ${tagClass}">${tagText}</span>
        </div>

        <div class="answers">
          <span style="font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;">
            ${promptLabel}
          </span>
          <div class="radio-pair">
            <input type="radio" name="meet_${idx}" id="meet_${idx}_yes" value="yes"
              ${meeting === "yes" ? "checked" : ""}>
            <label for="meet_${idx}_yes">Yes</label>
            <input type="radio" name="meet_${idx}" id="meet_${idx}_partial" value="partial"
              ${meeting === "partial" ? "checked" : ""}>
            <label for="meet_${idx}_partial">Partially</label>
            <input type="radio" name="meet_${idx}" id="meet_${idx}_no" value="no"
              ${meeting === "no" ? "checked" : ""}>
            <label for="meet_${idx}_no">No</label>
          </div>
        </div>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".radio-pair input").forEach(radio => {
    radio.addEventListener("change", function () {
      const card = this.closest(".test-card");
      const nutrient = card.dataset.nutrient;
      if (!dietState.intake) dietState.intake = {};
      dietState.intake[nutrient] = { meeting: this.value };
      saveDietProgress();
      if (typeof updateCounter === 'function') updateCounter();
    });
  });

  // the rest of the ranked list, one tap away
  const moreBox = document.getElementById("nutrient-more");
  if (moreBox) {
    moreBox.innerHTML = ranked.length > NUT_FIRST
      ? `<button type="button" class="refine-back" id="nutrient-more-btn" style="color:var(--teal);font-size:14px;margin:12px 0 0;">${nutShowAll ? "Show fewer &uarr;" : `Show the other ${ranked.length - NUT_FIRST} &darr;`}</button>` : "";
    const mb = document.getElementById("nutrient-more-btn");
    if (mb) mb.addEventListener("click", () => { nutShowAll = !nutShowAll; renderNutrients(); });
  }

  // Refresh live counter after nutrient list re-renders
  if (typeof updateCounter === 'function') updateCounter();
}

renderPage();
</script>
